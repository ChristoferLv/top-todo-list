<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE COOLEST TODO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="header">
            <p>THE COOLEST TODO</p>
        </div>
        <div class="sidebar">
            <div class="top">
                <p>Groups</p>
                <div id="add-group"></div>
            </div>
            <div class="groups-container"></div>
        </div>
        <div class="content">
            <div class="content-header">
                <p class="list-name">Tasks</p>
                <div class="add-todo"></div>
                <div class="delete-group"></div>
                <div class="break"></div>
                <div class="new-todo-tab hidden">
                    <label for="title">Title*</label>
                    <input id="title" type="text">
                    <label for="description">Description</label>
                    <input id="description" type="text">
                    <label for="dueDate">Due Date</label>
                    <input id="dueDate" type="datetime-local">
                    <label for="cores">Priority</label>
                    <select id="priority" name="priority">
                        <option selected value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <button type="button">Add</button>
                </div>
            </div>
            <div class="content-body"></div>
        </div>
    </div>



    <dialog id="add-group-dialog">
        <form id="myForm" method="dialog">
            <label for="groupName">Group</label>
            <input type="text" id="groupName" name="groupName" placeholder="Name" required>
            <button id="confirmBtn" value="default">Save</button>
            <button type="button" id="close-btn" value="cancel">Cancel</button>
        </form>
    </dialog>

    <dialog id="edit-task-dialog">
        <form id="editForm" method="dialog">
            <label for="newTitle">Title*</label>
            <input id="newTitle" name="title" type="text">
            <label for="newDescription">Description</label>
            <input id="newDescription" name="description" type="text">
            <label for="newDueDate">Due Date</label>
            <input id="newDueDate" name="dueDate" type="datetime-local">
            <label for="newPriority">Priority</label>
            <select id="newPriority" name="priority">
                <option selected value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
            <button id="confirmEditBtn" value="default">Save</button>
            <button type="button" id="close-edit-btn" value="cancel">Cancel</button>
        </form>
    </dialog>

    <script src="script.js" type="module"></script>
</body>

</html>
